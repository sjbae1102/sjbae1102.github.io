<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Conceptual diagram: landslide segmentation and change detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e8ecf4"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 0 16" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- Before / After labels -->
  <text x="100" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">before</text>
  <text x="300" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">after</text>
  <!-- Satellite tile (before) -->
  <g transform="translate(40, 40)">
    <rect width="120" height="90" rx="4" fill="url(#grid)" stroke="#94a3b8" stroke-width="1.25"/>
    <path d="M10 70 L40 45 L70 55 L95 35 L110 50 L110 90 L10 90 Z" fill="#94a3b8" opacity="0.25"/>
    <path d="M20 75 L55 50 L85 60 L100 45" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Arrow -->
  <path d="M175 85 L225 85" stroke="#5b6eae" stroke-width="1.5" fill="none"/>
  <polygon points="225,85 218,81 218,89" fill="#5b6eae"/>
  <!-- Segmentation mask overlay -->
  <g transform="translate(240, 40)">
    <rect width="120" height="90" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.25"/>
    <path d="M15 75 L50 48 L78 58 L105 38 L105 90 L15 90 Z" fill="#cbd5e1" opacity="0.4"/>
    <path d="M55 52 L72 68 L48 72 Z" fill="#5b6eae" opacity="0.45" stroke="#4a5f9c" stroke-width="1.25"/>
    <text x="60" y="82" text-anchor="middle" font-size="8" fill="#475569" font-family="Inter, system-ui, sans-serif">mask</text>
  </g>
  <!-- Terrain slope + landslide map -->
  <path d="M40 155 L360 155 L380 230 L20 230 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M40 155 L120 175 L200 165 L280 180 L360 155" fill="none" stroke="#64748b" stroke-width="1.25"/>
  <g fill="#5b6eae" opacity="0.5" stroke="#4a5f9c" stroke-width="1">
    <path d="M165 168 L195 195 L150 200 L140 175 Z"/>
    <path d="M255 172 L285 205 L240 210 L230 185 Z" opacity="0.7"/>
  </g>
  <text x="200" y="148" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">landslide / semantic segmentation</text>
  <text x="200" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">multi-temporal change detection (concept)</text>
</svg>

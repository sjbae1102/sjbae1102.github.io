<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Landslide monitoring with satellite change detection and segmentation">
  <defs>
    <linearGradient id="dis-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#e8f4fc"/>
    </linearGradient>
    <linearGradient id="dis-slope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="dis-mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0047ab" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a6fd4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="dis-slide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#14a085"/>
    </linearGradient>
    <pattern id="dis-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0 L0 0 0 12" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <filter id="dis-panel" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#dis-bg)"/>

  <g font-family="Inter, system-ui, sans-serif" font-weight="700" fill="#fff" font-size="8">
    <circle cx="52" cy="18" r="9" fill="#0d7377"/><text x="52" y="21" text-anchor="middle">1</text>
    <circle cx="148" cy="18" r="9" fill="#0047ab"/><text x="148" y="21" text-anchor="middle">2</text>
    <circle cx="252" cy="18" r="9" fill="#0047ab"/><text x="252" y="21" text-anchor="middle">3</text>
    <circle cx="348" cy="18" r="9" fill="#0d7377"/><text x="348" y="21" text-anchor="middle">4</text>
  </g>
  <text x="52" y="34" text-anchor="middle" font-size="7" font-weight="600" fill="#0d7377" font-family="Inter, system-ui, sans-serif">before</text>
  <text x="148" y="34" text-anchor="middle" font-size="7" font-weight="600" fill="#0047ab" font-family="Inter, system-ui, sans-serif">after</text>
  <text x="252" y="34" text-anchor="middle" font-size="7" font-weight="600" fill="#0047ab" font-family="Inter, system-ui, sans-serif">AI mask</text>
  <text x="348" y="34" text-anchor="middle" font-size="7" font-weight="600" fill="#0d7377" font-family="Inter, system-ui, sans-serif">inventory</text>

  <g transform="translate(16, 42)" filter="url(#dis-panel)">
    <rect width="72" height="58" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.1"/>
    <rect x="4" y="4" width="64" height="50" rx="4" fill="url(#dis-grid)"/>
    <path d="M8 44 L24 28 L40 34 L56 22 L64 30 L64 50 L8 50 Z" fill="#94a3b8" opacity="0.35"/>
    <path d="M12 46 L30 32 L48 38 L58 28" fill="none" stroke="#64748b" stroke-width="1"/>
    <text x="36" y="56" text-anchor="middle" font-size="6" fill="#64748b" font-family="Inter, system-ui, sans-serif">satellite tile</text>
  </g>

  <path d="M92 70 L108 70" stroke="#0047ab" stroke-width="1.5"/><polygon points="108,70 102,66 102,74" fill="#0047ab"/>

  <g transform="translate(112, 42)" filter="url(#dis-panel)">
    <rect width="72" height="58" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.1"/>
    <rect x="4" y="4" width="64" height="50" rx="4" fill="url(#dis-grid)"/>
    <path d="M8 44 L24 28 L40 34 L56 22 L64 30 L64 50 L8 50 Z" fill="#94a3b8" opacity="0.35"/>
    <path d="M38 36 L52 48 L44 52 L32 40 Z" fill="#64748b" opacity="0.5"/>
    <text x="36" y="56" text-anchor="middle" font-size="6" fill="#64748b" font-family="Inter, system-ui, sans-serif">change</text>
  </g>

  <path d="M188 70 L204 70" stroke="#0047ab" stroke-width="1.5"/><polygon points="204,70 198,66 198,74" fill="#0047ab"/>

  <g transform="translate(208, 42)" filter="url(#dis-panel)">
    <rect width="88" height="58" rx="6" fill="#fff" stroke="#0047ab" stroke-width="1.2"/>
    <rect x="4" y="4" width="80" height="50" rx="4" fill="#f8fafc"/>
    <path d="M10 46 L32 26 L52 34 L74 18 L80 28 L80 48 L10 48 Z" fill="#e2e8f0"/>
    <path d="M42 30 L58 44 L48 48 L34 36 Z" fill="url(#dis-mask)" stroke="#0047ab" stroke-width="1"/>
    <text x="44" y="56" text-anchor="middle" font-size="6" fill="#0047ab" font-weight="600" font-family="Inter, system-ui, sans-serif">segmentation</text>
  </g>

  <path d="M300 70 L316 70" stroke="#0d7377" stroke-width="1.5"/><polygon points="316,70 310,66 310,74" fill="#0d7377"/>

  <g transform="translate(320, 42)" filter="url(#dis-panel)">
    <rect width="64" height="58" rx="6" fill="#fff" stroke="#0d7377" stroke-width="1.1"/>
    <path d="M8 48 L56 48 L60 54 L4 54 Z" fill="url(#dis-slope)" opacity="0.4"/>
    <path d="M8 48 L20 44 L36 46 L52 42 L56 48" fill="none" stroke="#475569" stroke-width="1"/>
    <g fill="url(#dis-slide)" stroke="#0d7377" stroke-width="0.8">
      <path d="M22 44 L32 50 L26 52 L18 47 Z"/>
      <path d="M38 43 L48 49 L42 51 L34 46 Z" opacity="0.85"/>
    </g>
    <circle cx="48" cy="38" r="2" fill="#0047ab"/>
    <circle cx="28" cy="40" r="2" fill="#0047ab"/>
    <text x="32" y="56" text-anchor="middle" font-size="6" fill="#0d7377" font-family="Inter, system-ui, sans-serif">landslide map</text>
  </g>

  <rect x="12" y="108" width="376" height="132" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="128" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#334155">Disaster monitoring pipeline</text>
  <path d="M24 168 L376 168" fill="url(#dis-slope)" opacity="0.25"/>
  <path d="M24 168 L120 148 L200 158 L280 142 L376 162 L376 220 L24 220 Z" fill="#e2e8f0" opacity="0.5"/>
  <path d="M24 168 L100 152 L180 162 L260 150 L340 158 L376 168" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <g fill="url(#dis-slide)" opacity="0.75" stroke="#0d7377" stroke-width="0.9">
    <path d="M140 158 L168 188 L132 194 L124 168 Z"/>
    <path d="M248 154 L276 192 L238 198 L230 172 Z"/>
  </g>
  <rect x="280" y="178" width="88" height="36" rx="6" fill="url(#dis-mask)" stroke="#0047ab" stroke-width="1" opacity="0.9"/>
  <text x="324" y="200" text-anchor="middle" font-size="7" fill="#fff" font-weight="600" font-family="Inter, system-ui, sans-serif">hazard extent</text>
  <text x="24" y="238" font-size="7.5" fill="#64748b" font-family="Inter, system-ui, sans-serif">multi-temporal satellite analysis</text>
</svg>

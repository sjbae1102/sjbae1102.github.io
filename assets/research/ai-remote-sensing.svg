  </defs>
  <rect width="400" height="250" fill="url(#panel)"/>
  <!-- Inputs -->
  <g font-family="Inter, system-ui, sans-serif" font-size="9" fill="#475569" font-weight="600">
    <rect x="24" y="36" width="88" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/>
    <text x="68" y="58" text-anchor="middle">optical</text>
    <rect x="8" y="44" width="20" height="14" fill="#cbd5e1" opacity="0.6"/>

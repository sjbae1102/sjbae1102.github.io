<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Geospatial foundation model fusing optical, SAR, and meteorology for Earth observation outputs">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#eef7f5"/>
    </linearGradient>
    <linearGradient id="ai-model" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0047ab"/>
      <stop offset="100%" stop-color="#0d7377"/>
    </linearGradient>
    <linearGradient id="ai-optical" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d07c"/>
      <stop offset="100%" stop-color="#14a085"/>
    </linearGradient>
    <linearGradient id="ai-out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <filter id="ai-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0047ab" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#ai-bg)"/>

  <text x="200" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#0d7377">AI for remote sensing</text>
  <line x1="120" y1="26" x2="280" y2="26" stroke="#14a085" stroke-width="2"/>

  <g transform="translate(14, 36)">
    <rect width="96" height="178" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="48" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0047ab" font-family="Inter, system-ui, sans-serif">INPUTS</text>

    <g transform="translate(10, 28)">
      <rect width="76" height="44" rx="7" fill="#f8fafc" stroke="#14a085" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="7" fill="#fff" stroke="#0d7377" stroke-width="1"/><text x="12" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0d7377">1</text>
      <text x="48" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#334155" font-family="Inter, system-ui, sans-serif">optical</text>
      <rect x="14" y="26" width="14" height="10" rx="1" fill="url(#ai-optical)" opacity="0.7"/>
      <rect x="30" y="26" width="14" height="10" rx="1" fill="#0d7377" opacity="0.45"/>
      <rect x="46" y="26" width="14" height="10" rx="1" fill="#0047ab" opacity="0.35"/>
    </g>

    <g transform="translate(10, 80)">
      <rect width="76" height="44" rx="7" fill="#f8fafc" stroke="#0047ab" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="7" fill="#fff" stroke="#0047ab" stroke-width="1"/><text x="12" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0047ab">2</text>
      <text x="48" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#334155" font-family="Inter, system-ui, sans-serif">SAR</text>
      <path d="M20 30 L36 38 L28 44 L14 36 Z" fill="none" stroke="#64748b" stroke-width="1.2"/>
      <path d="M44 28 L58 36 L50 42 L36 34 Z" fill="none" stroke="#0047ab" stroke-width="1" opacity="0.6"/>
    </g>

    <g transform="translate(10, 132)">
      <rect width="76" height="44" rx="7" fill="#f8fafc" stroke="#0d7377" stroke-width="1.1"/>
      <circle cx="12" cy="12" r="7" fill="#fff" stroke="#0d7377" stroke-width="1"/><text x="12" y="15" text-anchor="middle" font-size="7" font-weight="700" fill="#0d7377">3</text>
      <text x="48" y="18" text-anchor="middle" font-size="8" font-weight="600" fill="#334155" font-family="Inter, system-ui, sans-serif">meteorology</text>
      <path d="M18 32 Q30 28 42 34 T62 32" fill="none" stroke="#0047ab" stroke-width="1.2"/>
      <circle cx="26" cy="36" r="2.5" fill="#14a085"/>
      <path d="M48 30 L52 34 L48 38" fill="none" stroke="#64748b" stroke-width="1"/>
    </g>
  </g>

  <g fill="none" stroke="#0047ab" stroke-width="1.3" opacity="0.65">
    <path d="M110 72 C140 72 150 125 168 125"/>
    <path d="M110 126 L168 126"/>
    <path d="M110 180 C140 180 150 127 168 127"/>
  </g>

  <g transform="translate(168, 78)" filter="url(#ai-glow)">
    <rect width="104" height="94" rx="12" fill="url(#ai-model)"/>
    <circle cx="52" cy="38" r="22" fill="none" stroke="#8ec5f7" stroke-width="1" opacity="0.5"/>
    <ellipse cx="52" cy="38" rx="22" ry="10" fill="none" stroke="#4ecca3" stroke-width="1" opacity="0.6"/>
    <g fill="none" stroke="#e8f4fc" stroke-width="1">
      <circle cx="40" cy="32" r="5" fill="#fff" fill-opacity="0.15"/><circle cx="64" cy="30" r="5"/>
      <circle cx="52" cy="48" r="5"/><circle cx="36" cy="50" r="4"/><circle cx="68" cy="50" r="4"/>
      <line x1="40" y1="32" x2="52" y2="48"/><line x1="64" y1="30" x2="52" y2="48"/>
      <line x1="36" y1="50" x2="52" y2="48"/><line x1="68" y1="50" x2="52" y2="48"/>
    </g>
    <text x="52" y="72" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff" font-family="Inter, system-ui, sans-serif">geospatial</text>
    <text x="52" y="84" text-anchor="middle" font-size="7.5" font-weight="700" fill="#c4d0f5" font-family="Inter, system-ui, sans-serif">foundation model</text>
  </g>

  <g fill="none" stroke="#0d7377" stroke-width="1.3" opacity="0.7">
    <path d="M272 100 L298 88"/><path d="M272 125 L298 125"/><path d="M272 150 L298 162"/>
  </g>

  <g transform="translate(298, 48)">
    <rect width="88" height="154" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="44" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="#0d7377" font-family="Inter, system-ui, sans-serif">OUTPUTS</text>

    <g transform="translate(8, 26)">
      <rect width="72" height="36" rx="6" fill="url(#ai-out)" stroke="#14a085" stroke-width="1"/>
      <text x="36" y="14" text-anchor="middle" font-size="7" font-weight="600" fill="#0d7377" font-family="Inter, system-ui, sans-serif">GPP</text>
      <rect x="10" y="18" width="52" height="12" rx="2" fill="url(#ai-optical)" opacity="0.5"/>
    </g>
    <g transform="translate(8, 70)">
      <rect width="72" height="36" rx="6" fill="url(#ai-out)" stroke="#0047ab" stroke-width="1"/>
      <text x="36" y="14" text-anchor="middle" font-size="7" font-weight="600" fill="#0047ab" font-family="Inter, system-ui, sans-serif">LST</text>
      <rect x="10" y="18" width="52" height="12" rx="2" fill="#0047ab" opacity="0.25"/>
      <circle cx="22" cy="24" r="4" fill="#f59e0b" opacity="0.6"/><circle cx="38" cy="26" r="3" fill="#ef4444" opacity="0.45"/>
    </g>
    <g transform="translate(8, 114)">
      <rect width="72" height="36" rx="6" fill="url(#ai-out)" stroke="#0d7377" stroke-width="1"/>
      <text x="36" y="14" text-anchor="middle" font-size="7" font-weight="600" fill="#334155" font-family="Inter, system-ui, sans-serif">hazard maps</text>
      <path d="M14 28 L28 22 L42 26 L58 20" fill="none" stroke="#0d7377" stroke-width="1"/>
      <path d="M32 24 L40 32 L28 34 Z" fill="#0047ab" opacity="0.4"/>
    </g>
  </g>

  <text x="200" y="242" text-anchor="middle" font-size="7.5" fill="#64748b" font-family="Inter, system-ui, sans-serif">multi-source Earth observation fusion</text>
</svg>

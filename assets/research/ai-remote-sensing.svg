  <g fill="none" stroke="#8b9fd4" stroke-width="1">
    <circle cx="212" cy="100" r="6"/><circle cx="236" cy="92" r="6"/><circle cx="260" cy="100" r="6"/>
    <circle cx="224" cy="125" r="6"/><circle cx="248" cy="125" r="6"/>
    <circle cx="212" cy="150" r="6"/><circle cx="236" cy="158" r="6"/><circle cx="260" cy="150" r="6"/>
    <line x1="212" y1="100" x2="224" y2="125"/><line x1="236" y1="92" x2="224" y2="125"/>
    <line x1="260" y1="100" x2="248" y2="125"/><line x1="224" y1="125" x2="212" y2="150"/>
    <line x1="248" y1="125" x2="236" y2="158"/><line x1="248" y1="125" x2="260" y2="150"/>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Terrestrial carbon flux and hourly GPP from geostationary remote sensing">
  <defs>
    <linearGradient id="gpp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="55%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#eef7f5"/>
    </linearGradient>
    <linearGradient id="gpp-canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26d07c"/>
      <stop offset="100%" stop-color="#0d7377"/>
    </linearGradient>
    <linearGradient id="gpp-hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ecca3"/>
      <stop offset="100%" stop-color="#14a085"/>
    </linearGradient>
    <linearGradient id="gpp-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gpp-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0047ab" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#14a085" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#26d07c" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="gpp-soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0d7377" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#gpp-sky)"/>
  <rect x="8" y="8" width="384" height="234" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#fff">
    <circle cx="22" cy="22" r="9" fill="#0047ab"/><text x="22" y="25" text-anchor="middle">1</text>
    <circle cx="198" cy="22" r="9" fill="#0d7377"/><text x="198" y="25" text-anchor="middle">2</text>
    <circle cx="368" cy="22" r="9" fill="#0047ab"/><text x="368" y="25" text-anchor="middle">3</text>
  </g>
  <text x="22" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#0047ab">Himawari-8</text>
  <text x="198" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#0d7377">photosynthesis</text>
  <text x="368" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#0047ab">hourly GPP</text>

  <g transform="translate(28, 48)">
    <circle cx="28" cy="22" r="16" fill="url(#gpp-sun)" stroke="#f59e0b" stroke-width="1"/>
    <g stroke="#fbbf24" stroke-width="1.1" opacity="0.85">
      <line x1="28" y1="2" x2="28" y2="-4"/><line x1="28" y1="42" x2="28" y2="48"/>
      <line x1="8" y1="22" x2="2" y2="22"/><line x1="48" y1="22" x2="54" y2="22"/>
    </g>
    <g stroke="#0047ab" stroke-width="1.2" fill="none" opacity="0.5">
      <path d="M46 28 L95 55"/><path d="M42 32 L92 58"/><path d="M38 36 L88 62"/>
    </g>
    <text x="28" y="68" text-anchor="middle" font-size="7" fill="#64748b" font-family="Inter, system-ui, sans-serif">solar radiation</text>
  </g>

  <g transform="translate(118, 44)" filter="url(#gpp-soft)">
    <ellipse cx="52" cy="78" rx="58" ry="14" fill="#cbd5e1" opacity="0.35"/>
    <path d="M0 70 Q26 48 52 58 T104 52 T156 62 L156 88 L0 88 Z" fill="url(#gpp-hill)" opacity="0.55"/>
    <path d="M8 72 Q40 58 72 66 T128 60 L128 86 L8 86 Z" fill="url(#gpp-canopy)"/>
    <ellipse cx="36" cy="66" rx="14" ry="9" fill="#26d07c" opacity="0.85"/>
    <ellipse cx="68" cy="62" rx="18" ry="11" fill="#14a085"/>
    <ellipse cx="102" cy="66" rx="15" ry="10" fill="#0d7377" opacity="0.9"/>
    <g fill="none" stroke="#0047ab" stroke-width="1.3" stroke-linecap="round">
      <path d="M44 38 L44 54"/><polygon points="44,54 40,48 48,48" fill="#0047ab"/>
      <path d="M72 34 L72 50"/><polygon points="72,50 68,44 76,44" fill="#0047ab"/>
      <path d="M100 38 L100 54"/><polygon points="100,54 96,48 104,48" fill="#0047ab"/>
    </g>
    <text x="72" y="28" text-anchor="middle" font-size="7" fill="#0d7377" font-weight="600" font-family="Inter, system-ui, sans-serif">CO2 uptake</text>
  </g>

  <g transform="translate(248, 50)">
    <rect x="0" y="0" width="88" height="52" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.1"/>
    <rect x="6" y="6" width="76" height="40" rx="3" fill="url(#gpp-tile)"/>
    <path d="M10 38 L22 28 L34 32 L48 22 L62 30 L78 24 L78 42 L10 42 Z" fill="none" stroke="#0d7377" stroke-width="0.8" opacity="0.6"/>
    <text x="44" y="58" text-anchor="middle" font-size="7" fill="#334155" font-family="Inter, system-ui, sans-serif">flux map</text>
  </g>

  <g transform="translate(268, 8)">
    <rect x="0" y="12" width="42" height="26" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
    <rect x="-22" y="18" width="18" height="14" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <rect x="46" y="18" width="18" height="14" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="20" width="26" height="8" fill="#0047ab" opacity="0.25"/>
    <circle cx="21" cy="6" r="5" fill="#0047ab" opacity="0.35" stroke="#334155" stroke-width="1"/>
    <path d="M21 11 L21 12" stroke="#334155" stroke-width="1.2"/>
    <path d="M21 0 Q60 8 88 28" fill="none" stroke="#0d7377" stroke-width="1" stroke-dasharray="3 2" opacity="0.7"/>
    <text x="21" y="48" text-anchor="middle" font-size="6.5" fill="#0047ab" font-weight="600" font-family="Inter, system-ui, sans-serif">GEO orbit</text>
  </g>

  <rect x="12" y="118" width="376" height="124" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="136" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d7377">Terrestrial carbon flux</text>
  <line x1="24" y1="142" x2="120" y2="142" stroke="#14a085" stroke-width="2"/>
  <path d="M24 200 Q80 175 140 188 T260 178 T360 190" fill="none" stroke="#26d07c" stroke-width="2" opacity="0.7"/>
  <path d="M24 210 Q100 195 180 205 T320 198" fill="none" stroke="#0047ab" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 3"/>
  <text x="24" y="228" font-size="7.5" fill="#64748b" font-family="Inter, system-ui, sans-serif">canopy response</text>
  <text x="300" y="228" font-size="7.5" fill="#0047ab" font-family="Inter, system-ui, sans-serif">diurnal cycle</text>
</svg>
